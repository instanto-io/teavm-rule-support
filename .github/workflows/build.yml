name: Verify and publish relocation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  verify:
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Verify relocation POM
      goals: -U clean verify
      maven-args: -Dspotless.skip=true
    secrets: inherit
  publish-snapshot:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify]
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Publish relocation POM
      goals: -U deploy
      maven-args: -Dspotless.skip=true
    secrets: inherit

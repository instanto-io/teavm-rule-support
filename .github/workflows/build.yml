name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify (${{ matrix.browser_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser_name: Chrome
            runner: browser-chrome
          - browser_name: Firefox
            runner: browser-firefox
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify in ${{ matrix.browser_name }}
        run: >-
          mvn --batch-mode --no-transfer-progress --errors --fail-at-end
          -Drule.support.test.browser=${{ matrix.runner }} clean test

  publish-snapshot:
    if: github.repository == 'instanto-io/teavm-rule-support' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Publish Maven snapshot
        run: >-
          mvn --settings .github/maven-settings.xml --batch-mode --no-transfer-progress
          --errors --fail-at-end -DskipTests deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
